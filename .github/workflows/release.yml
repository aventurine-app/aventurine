name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.1 && git push origin v0.2.1
#
# This builds the Linux, Windows and macOS installers and ATTACHES them to the
# GitHub Release alongside GitHub's auto-generated source archives.
#
# HISTORY — releases used to ship source only, with the compiled installers
# kept as private workflow artifacts, because the official binary was fenced
# behind the old licensing model. That model is gone: the app is GPL v3, so the
# binary is now part of the public release. aventurine-app.com/downloads.html
# links straight at these asset URLs, and those links 404 until the release is
# published with the files attached.
#
# THREE jobs. `build` and `build-mac` compile and hand their output up as
# workflow artifacts; `release` collects both and creates the release. macOS is
# split out because it cannot be cross-built: electron-builder needs Apple's own
# tooling (hdiutil for the .dmg, codesign for the bundle). Windows CAN be
# cross-built (Wine runs rcedit on the Linux host), so `build` produces both
# Linux and Windows from one ubuntu runner.
#
# The release is created as a DRAFT for review. Publishing it is a manual step,
# and it is that click that fires notify-website.yml.
#
# NOTE — no auto-update: the app ships no in-app updater (electron-updater was
# removed). Users update by installing a newer build.
on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the `release` job writes, and it asks for that
# itself, so a compromised build step cannot touch the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder cross-builds the Windows .exe on Linux but needs Wine
      # to run rcedit (icon/version stamping). If a future runner image drops
      # these stock packages, switch to the WineHQ apt repo.
      #
      # `wine` is load-bearing and easy to miss: electron-builder spawns the
      # plain `wine` binary, which on Ubuntu noble ships in the `wine` package
      # alone — wine64 provides /usr/bin/wine64, not /usr/bin/wine, and
      # --no-install-recommends stops `wine` being pulled in as a recommend.
      # Dropping it fails the Windows build with `spawn wine ENOENT` (v0.5.1).
      # `wine --version` fails this step early instead of 5 minutes later inside
      # electron-builder.
      #
      # continue-on-error for the same reason the Windows build below has it: the
      # Windows toolchain is best-effort and must never stop the release. A hard
      # failure here would SKIP the un-guarded steps that follow (dependencies,
      # Linux installers), leaving the artifact upload with no files to upload —
      # so the whole run would collapse over a Wine problem.
      - name: Install Wine (Windows cross-build toolchain)
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32
          wine --version

      # postinstall (scripts/setup-native-abis.js) parks the prebuilt
      # better-sqlite3-multiple-ciphers Linux binaries; no C toolchain / rebuild.
      - name: Install dependencies
        working-directory: electron
        run: npm install

      # Linux targets (AppImage + rpm + deb). `--publish never` keeps
      # electron-builder itself out of the GitHub API; the `release` job below
      # owns every upload, so one place decides what ships. (electron-builder.yml
      # carries no publish config either, so this flag is belt and braces.)
      - name: Build Linux installers
        working-directory: electron
        run: npm run dist:linux -- --publish never

      # Windows NSIS installer, cross-built. dist:win parks the win32-x64 sqlite
      # prebuild (scripts/setup-win-abi.js) then runs electron-builder --win;
      # Wine (installed above) does the .exe stamping. `--publish never` for the
      # same reason as the Linux build above.
      #
      # BEST-EFFORT: the Wine cross-build is fragile against runner-image drift
      # (a newer ubuntu-latest / Wine can break the .exe stamping — this is what
      # the Install Wine note above warns about). continue-on-error keeps a Wine
      # flake from failing the run, so a bad Windows build costs the release its
      # .exe and nothing else. Re-running the workflow attaches it later; see
      # the `release` job, which upgrades to an upload when the release exists.
      - name: Build Windows installer
        continue-on-error: true
        working-directory: electron
        run: npm run dist:win -- --publish never

      # Hand the installers to the `release` job. `if: always()` so the Linux
      # installers still upload when the best-effort Windows step above failed
      # (Linux always produces files, so if-no-files-found:error stays
      # satisfied). *.exe does not match *.exe.blockmap, so the blockmap and
      # electron-builder's latest*.yml metadata stay out of the release.
      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aventurine-installers-${{ github.ref_name }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.rpm
            electron/dist/*.deb
            electron/dist/*.exe
          if-no-files-found: error

  # macOS installers. Separate job because there is no cross-build: electron-builder
  # needs Apple's own tooling (hdiutil for the .dmg, codesign for the bundle), so
  # this is the one target that must run on a Mac.
  #
  # BEST-EFFORT, like the Windows step in `build`: this job failing must not stop
  # the release, which the `release` job cuts from the tag alone.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the other jobs pin. Nothing here RUNS on host Node
          # (npm test is the test workflow's job) — but postinstall still parks a
          # host-Node binary, and better-sqlite3-multiple-ciphers publishes no
          # darwin prebuild for Node 20's ABI, so a 20 runner would compile
          # SQLite from source for a runtime this job never uses. 22 has the
          # prebuild; the whole install stays download-only.
          node-version: 22

      # postinstall (scripts/setup-native-abis.js) parks the prebuilt
      # better-sqlite3-multiple-ciphers binaries for host Node and for Electron
      # at the runner's own arch (arm64).
      - name: Install dependencies
        working-directory: electron
        run: npm install

      # arm64 + x64 .dmg. dist:mac parks BOTH darwin native binaries first
      # (scripts/setup-mac-abi.js) — the runner is Apple Silicon, so the Intel
      # build is a cross-build and would otherwise ship an arm64 .node that dies
      # on first DB open.
      #
      # SIGNING: the app is ad-hoc signed and NOT notarized (no Apple Developer
      # ID) — see the SECURITY note in electron-builder.yml. Now that these .dmg
      # files are attached to the public release, that gap is user-visible:
      # Gatekeeper blocks a downloaded unnotarized build until the user opens it
      # from the right-click menu. CSC auto-discovery stays off so
      # electron-builder never picks up a stray runner keychain identity instead
      # of the configured ad-hoc one.
      - name: Build macOS installers
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --publish never

      # Its own artifact name: upload-artifact v4 requires names to be unique
      # within a run. No `if: always()` here, unlike the other job: there is
      # nothing best-effort above this step, so on a failed build the useful
      # error is the build's — letting this run too would bury it under
      # "no files found".
      - name: Upload macOS installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aventurine-installers-mac-${{ github.ref_name }}
          path: electron/dist/*.dmg
          if-no-files-found: error

  # The one job that touches the GitHub Release, so there is a single answer to
  # "what shipped and who put it there". It waits for both build jobs and then
  # attaches whatever they managed to produce.
  #
  # `if: always()` decouples the release from the best-effort builds: a Wine
  # flake or a macOS failure costs the release that one file, never the release
  # itself. The content that matters is the source tag, which exists whether or
  # not any binary built.
  release:
    needs: [build, build-mac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      # Both artifacts flattened into one directory. The pattern matches
      # `aventurine-installers-<tag>` and `aventurine-installers-mac-<tag>`.
      # continue-on-error because a run where both build jobs failed has no
      # artifacts at all, and that must still produce the source-only release.
      - name: Collect the built installers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: aventurine-installers-*
          merge-multiple: true

      # Create the release, or upload into it if it already exists. The second
      # case is a re-run: `gh release create` fails outright on an existing tag,
      # which would make re-running the workflow to pick up a fixed Windows
      # build impossible. --clobber replaces an asset of the same name rather
      # than erroring on the duplicate.
      #
      # DRAFT on purpose. Nothing is public until the draft is reviewed and
      # published by hand, and publishing is what fires notify-website.yml.
      #
      # An empty `files` array is fine: gh then creates a release carrying only
      # GitHub's generated source archives, which is the old behaviour.
      - name: Attach the installers to the release
        id: attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(installers/*.AppImage installers/*.rpm installers/*.deb installers/*.exe installers/*.dmg)

          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Attaching ${#files[@]} file(s) to $TAG:"
          if [ ${#files[@]} -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi

          # Written as full if-blocks rather than `[ ... ] && cmd`, because
          # under `set -e` a false test at the end of a branch makes the branch
          # itself exit non-zero and fails the step.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading into it."
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              "${files[@]}"
          fi

      # A run that attached nothing is almost always a broken toolchain rather
      # than an intended source-only release, and the website's download links
      # would 404 on it. Fail the job so this shows up as a red run instead of a
      # green one holding an empty release.
      - name: Fail if no installers were attached
        if: steps.attach.outputs.count == '0'
        run: |
          echo "::error::No installers were attached to ${{ github.ref_name }}. The release carries source archives only; check the build jobs above."
          exit 1
