name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.1 && git push origin v0.2.1
#
# This builds the Linux, Windows AND macOS installers but does NOT attach them
# to the GitHub Release. Releases ship SOURCE ONLY: GitHub auto-generates the
# "Source code (zip/tar.gz)" assets from the tag, and that is all the public
# release contains. This matches the source-available licensing direction — the
# official compiled binary is fenced, not distributed from the public release
# feed.
#
# TWO jobs, because macOS cannot be cross-built. Windows can (Wine runs rcedit
# on the Linux host), so `build` produces both from one ubuntu runner; the .app
# bundle, hdiutil and codesign are Apple-only, so `build-mac` runs on a macOS
# runner. The jobs are independent: neither blocks the other, and neither blocks
# the source-only release, which is cut from the tag by `build`.
#
# The built installers are kept as private workflow ARTIFACTS (downloadable from
# this Actions run), so the maintainer still gets the official binary without
# publishing it.
#
# NOTE — no auto-update: the app ships no in-app updater (electron-updater was
# removed), and releases carry no installers anyway. Users update by installing
# a newer build.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the source-only GitHub Release for the tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder cross-builds the Windows .exe on Linux but needs Wine
      # to run rcedit (icon/version stamping). If a future runner image drops
      # these stock packages, switch to the WineHQ apt repo.
      #
      # `wine` is load-bearing and easy to miss: electron-builder spawns the
      # plain `wine` binary, which on Ubuntu noble ships in the `wine` package
      # alone — wine64 provides /usr/bin/wine64, not /usr/bin/wine, and
      # --no-install-recommends stops `wine` being pulled in as a recommend.
      # Dropping it fails the Windows build with `spawn wine ENOENT` (v0.5.1).
      # `wine --version` fails this step early instead of 5 minutes later inside
      # electron-builder.
      #
      # continue-on-error for the same reason the Windows build below has it: the
      # Windows toolchain is best-effort and must never stop the source-only
      # release. A hard failure here would SKIP the un-guarded steps that follow
      # (dependencies, Linux installers), leaving the artifact upload with no
      # files to upload — so the whole run would collapse over a Wine problem.
      - name: Install Wine (Windows cross-build toolchain)
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32
          wine --version

      # postinstall (scripts/setup-native-abis.js) parks the prebuilt
      # better-sqlite3-multiple-ciphers Linux binaries; no C toolchain / rebuild.
      - name: Install dependencies
        working-directory: electron
        run: npm install

      # Linux targets (AppImage + rpm + deb). `--publish never` guarantees
      # nothing is uploaded to the GitHub Release even though a publish: block
      # exists in electron-builder.yml — releases are source-only.
      - name: Build Linux installers
        working-directory: electron
        run: npm run dist:linux -- --publish never

      # Windows NSIS installer, cross-built. dist:win parks the win32-x64 sqlite
      # prebuild (scripts/setup-win-abi.js) then runs electron-builder --win;
      # Wine (installed above) does the .exe stamping. Also never published.
      #
      # BEST-EFFORT: the Wine cross-build is fragile against runner-image drift
      # (a newer ubuntu-latest / Wine can break the .exe stamping — this is what
      # the Install Wine note above warns about). continue-on-error keeps a Wine
      # flake from failing the run: the SOURCE-ONLY release does not need this
      # binary (it's a private artifact), so it must never block the release.
      - name: Build Windows installer
        continue-on-error: true
        working-directory: electron
        run: npm run dist:win -- --publish never

      # Keep the installers as a private workflow artifact (the fenced official
      # binary). Downloadable from this Actions run; never attached to the
      # public release. `if: always()` so the Linux installers still upload even
      # when the best-effort Windows step above failed (Linux always produces
      # files, so if-no-files-found:error stays satisfied).
      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aventurine-installers-${{ github.ref_name }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.rpm
            electron/dist/*.deb
            electron/dist/*.exe
          if-no-files-found: error

      # Create the SOURCE-ONLY GitHub Release for this tag as a DRAFT. No assets
      # are uploaded, so it contains only GitHub's auto-generated source
      # archives. Review the draft on the Releases page, then Publish.
      # `if: always()` decouples the public release from the private installer
      # builds — a Wine flake (or any earlier best-effort step) must not stop us
      # cutting the source-only release. The release content is the source tag,
      # which exists regardless of whether the binaries built.
      - name: Create source-only draft release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes

  # macOS installers. Separate job because there is no cross-build: electron-builder
  # needs Apple's own tooling (hdiutil for the .dmg, codesign for the bundle), so
  # this is the one target that must run on a Mac.
  #
  # BEST-EFFORT, like the Windows step in `build`: this job failing must not stop
  # the source-only release, which is cut by the other job from the tag alone.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the other jobs pin. Nothing here RUNS on host Node
          # (npm test is the test workflow's job) — but postinstall still parks a
          # host-Node binary, and better-sqlite3-multiple-ciphers publishes no
          # darwin prebuild for Node 20's ABI, so a 20 runner would compile
          # SQLite from source for a runtime this job never uses. 22 has the
          # prebuild; the whole install stays download-only.
          node-version: 22

      # postinstall (scripts/setup-native-abis.js) parks the prebuilt
      # better-sqlite3-multiple-ciphers binaries for host Node and for Electron
      # at the runner's own arch (arm64).
      - name: Install dependencies
        working-directory: electron
        run: npm install

      # arm64 + x64 .dmg. dist:mac parks BOTH darwin native binaries first
      # (scripts/setup-mac-abi.js) — the runner is Apple Silicon, so the Intel
      # build is a cross-build and would otherwise ship an arm64 .node that dies
      # on first DB open. `--publish never` for the same reason as the Linux
      # build: releases are source-only.
      #
      # Signing: the app is ad-hoc signed and NOT notarized (no Apple Developer
      # ID) — see the SECURITY note in electron-builder.yml. CSC auto-discovery
      # is off so electron-builder never picks up a stray runner keychain
      # identity instead of the configured ad-hoc one.
      - name: Build macOS installers
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --publish never

      # Private workflow artifact, same as the Linux/Windows one. Its own name:
      # upload-artifact v4 requires artifact names to be unique within a run.
      # No `if: always()` here, unlike the other job: there is nothing
      # best-effort above this step, so on a failed build the useful error is
      # the build's — letting this run too would bury it under "no files found".
      - name: Upload macOS installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aventurine-installers-mac-${{ github.ref_name }}
          path: electron/dist/*.dmg
          if-no-files-found: error
