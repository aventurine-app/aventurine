<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine | Recurring</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/recurring.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<div class="rec-page">

    <!-- This page's cards are the calendar/rail pair below, so its month
         control rides a toolbar row instead of a card header. Adding and
         detecting schedules live at the foot of the rail, next to the list they
         act on, so nothing sits on the right of this row.
         The month label is a picker (recurring.js), same as Dashboard's
         stepper — the caret .stepper-label draws is not decoration.
         Today rides beside the stepper as the one-hop way back from any month
         the arrows wandered into; it stays in place and goes disabled on the
         current month rather than disappearing, so stepping past today doesn't
         make the toolbar jump. -->
    <div class="rec-toolbar">
        <div class="rec-toolbar-left">
            <div class="stepper stepper-joined rec-month-stepper" aria-label="Recurring month">
                <button type="button" class="stepper-btn button-primary" id="rec-month-prev" aria-label="Previous month"><svg class="stepper-btn-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg></button>
                <button type="button" class="stepper-label" id="rec-month-label" aria-live="polite">&nbsp;<svg class="picker-caret" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
                <button type="button" class="stepper-btn button-primary" id="rec-month-next" aria-label="Next month"><svg class="stepper-btn-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg></button>
            </div>
            <button type="button" class="button-secondary rec-today-btn" id="rec-month-today" title="Back to the current month">Today</button>
        </div>
    </div>

    <!-- The calendar is the listing: each occurrence is a chip carrying its
         schedule's data — the merchant, the amount, and the rest in its
         tooltip. A chip opens nothing, on hover or on click. Everything a
         schedule can be changed to is in the editor, which a rail row opens. -->

    <!-- Totals, calendar and rail are one grid rather than three stacked blocks:
         the totals row spans both columns, so the rail's first row starts level
         with the calendar's top edge instead of with the totals above it.
         #rec-summary and #rec-rail are empty until recurring.js has a month to
         total. The rail is never hidden: its foot carries the only Add and
         Detect controls on the page, so a calendar with nothing on it yet still
         has both of them in reach. -->
    <div class="rec-main" id="rec-main">
        <div class="rec-summary" id="rec-summary"></div>
        <div class="rec-calendar" id="rec-calendar"></div>
        <aside class="rec-rail" id="rec-rail" aria-label="Schedules this month"></aside>
    </div>

</div>

        </div>
    </div>

    <!-- @include scripts -->
    <!-- Merchant avatars: the generated slug→icon manifest, then the renderer
         that reads it. Page-level rather than shared chrome — see the note in
         pages/partials/scripts.html. Manifest first: avatar.js reads
         window.MERCHANT_ICONS. -->
    <script src="/static/js/core/merchant-icons.js"></script>
    <script src="/static/js/core/avatar.js"></script>
    <script src="/static/js/pages/recurring.js"></script>
</body>
</html>
