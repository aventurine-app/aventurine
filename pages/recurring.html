<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine | Recurring</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/recurring.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<div class="rec-page">

    <div class="rec-intro">
        <h1 class="rec-heading">Recurring<span class="fc-info" tabindex="0" role="note"
            aria-label="Merchants that repeat on a steady schedule — weekly, biweekly, monthly, quarterly, or yearly — detected automatically from your transaction history. A pattern needs at least three charges before it's trusted, and drops off here if it goes quiet. Every field is editable, and you can add a schedule by hand or remove one from the ⋮ menu / its row."
            data-tip="Merchants that repeat on a steady schedule — weekly, biweekly, monthly, quarterly, or yearly — detected automatically from your transaction history. A pattern needs at least three charges before it's trusted, and drops off here if it goes quiet. Every field is editable, and you can add a schedule by hand or remove one from the ⋮ menu / its row.">i</span></h1>
    </div>

    <div class="rec-toolbar">
        <div class="stepper rec-month-stepper" aria-label="Recurring month">
            <button type="button" class="stepper-btn button-primary" id="rec-month-prev" aria-label="Previous month">&#8249;</button>
            <button type="button" class="stepper-label" id="rec-month-label" aria-live="polite">&nbsp;</button>
            <button type="button" class="stepper-btn button-primary" id="rec-month-next" aria-label="Next month">&#8250;</button>
        </div>
        <button type="button" class="p-menu-btn" id="rec-kebab-btn" title="Recurring options" aria-label="Recurring options" aria-haspopup="menu">⋮</button>
    </div>

    <div class="rec-layout" id="rec-layout">
        <div class="rec-calendar" id="rec-calendar"></div>
        <div class="rec-list" id="rec-list"></div>
    </div>

</div>

        </div>
    </div>

    <!-- @include scripts -->
    <script src="/static/js/pages/recurring.js"></script>
</body>
</html>
