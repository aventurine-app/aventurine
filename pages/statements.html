<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine | Statements</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/tables.css">
    <!-- Categories editor styles — the shared .cat-* modal shell, rows and
         controls behind both toolbar modals (Manage Years, and the two panels
         of Manage Columns). Loads BEFORE statements.css, which overrides some
         of those rules for the year rows. -->
    <link rel="stylesheet" href="/static/css/categories.css">
    <link rel="stylesheet" href="/static/css/statements.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<div class="db-page stmt-page">
    <!-- Single toolbar row: tabs (the page's identity — there is no title) on
         the left; year stepper dead-center on the row; the page's two actions
         on the right. Manage Years opens the add/renumber/remove modal;
         Manage Columns opens the categories and balance-sheet accounts
         editors as two panels of one modal, on the panel for the current tab.
         Controller: statements.js. -->
    <section class="stmt-sheet" id="stmt-sheet" aria-label="Statement">
        <div class="stmt-toolbar">
            <div class="stmt-tabs" role="tablist" aria-label="Statements">
                <button type="button" class="stmt-tab active" id="stmt-tab-cashflow" role="tab"
                    data-tab="cashflow" aria-controls="stmt-panel-cashflow" aria-selected="true">Cash Flow</button>
                <button type="button" class="stmt-tab" id="stmt-tab-balance" role="tab"
                    data-tab="balance" aria-controls="stmt-panel-balance" aria-selected="false" tabindex="-1">Balance Sheet</button>
            </div>
            <div class="stepper stepper-joined stmt-year-stepper" aria-label="Statement year">
                <button type="button" class="stepper-btn button-primary" id="stmt-year-prev" aria-label="Previous year" disabled><svg class="stepper-btn-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg></button>
                <button type="button" class="stepper-label" id="stmt-year-label" aria-live="polite"
                    aria-haspopup="menu" title="Choose year">&nbsp;<svg class="picker-caret" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
                <button type="button" class="stepper-btn button-primary" id="stmt-year-next" aria-label="Next year" disabled><svg class="stepper-btn-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg></button>
            </div>
            <div class="stmt-toolbar-right">
                <button type="button" class="button-secondary" id="stmt-years-btn">Manage Years</button>
                <button type="button" class="button-secondary" id="stmt-columns-btn">Manage Columns</button>
            </div>
        </div>

        <div class="stmt-panel" id="stmt-panel-cashflow" role="tabpanel"
            data-panel="cashflow" aria-labelledby="stmt-tab-cashflow">
            <div class="db-tables-container" id="stmt-tables-cashflow"></div>
            <p class="stmt-empty" id="stmt-empty-cashflow" hidden></p>
        </div>

        <div class="stmt-panel" id="stmt-panel-balance" role="tabpanel"
            data-panel="balance" aria-labelledby="stmt-tab-balance" hidden>
            <div class="db-tables-container" id="stmt-tables-balance"></div>
            <p class="stmt-empty" id="stmt-empty-balance" hidden></p>
        </div>
    </section>
</div>

        </div>
    </div>

    <!-- @include scripts -->
    <script src="/static/js/widgets/cellselect.js"></script>
    <script src="/static/js/widgets/tables.js"></script>
    <script src="/static/js/pages/statements.js"></script>
</body>
</html>
