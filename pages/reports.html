<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine | Reports</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/forecast.css">
    <link rel="stylesheet" href="/static/css/trends.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<div class="rep-reports">

    <!-- Report tabs. Adding another report = a .rep-tab button here + a matching
         .rep-panel below, in the same order. Controller: reports.js (data-driven,
         no JS change). Each panel owns its own controls — a report's pickers live
         in its card header (or its own toolbar row), never hoisted up here, so a
         report stays a self-contained block of markup. -->
    <div class="rep-tabs" role="tablist" aria-label="Reports">
        <button type="button" class="rep-tab active" id="rep-tab-cashflow" role="tab"
            data-tab="cashflow" aria-controls="rep-panel-cashflow" aria-selected="true">Cash Flow</button>
        <button type="button" class="rep-tab" id="rep-tab-spending" role="tab"
            data-tab="spending" aria-controls="rep-panel-spending" aria-selected="false" tabindex="-1">Spending</button>
        <button type="button" class="rep-tab" id="rep-tab-forecast" role="tab"
            data-tab="forecast" aria-controls="rep-panel-forecast" aria-selected="false" tabindex="-1">Forecast</button>
    </div>

    <div class="rep-panel" id="rep-panel-cashflow" role="tabpanel"
        data-panel="cashflow" aria-labelledby="rep-tab-cashflow" tabindex="0">

<div class="forecast-page">

    <div class="forecast-card forecast-card-main">
        <div class="dashboard-card-header">
            <span class="dashboard-card-title">Cash Flow<span class="fc-info" tabindex="0" role="note"
                aria-label="Where your money flowed for the selected year. Income categories on the left feed a central Net Inflow, which fans out to your expense categories on the right; each band is sized by the total for that category. Hover any node or flow for its amount. Everything is computed on your device — nothing leaves it."
                data-tip="Where your money flowed for the selected year. Income categories on the left feed a central Net Inflow, which fans out to your expense categories on the right; each band is sized by the total for that category. Hover any node or flow for its amount. Everything is computed on your device — nothing leaves it.">i</span></span>
            <div class="forecast-controls">
                <div class="range-selector" id="cashflow-year">
                    <button class="range-selector-btn" id="cashflow-year-btn" type="button">Year</button>
                    <div class="range-selector-menu" id="cashflow-year-menu" hidden></div>
                </div>
            </div>
        </div>

        <!-- Empty state lands here when the selected year has no data. -->
        <div id="cashflow-empty"></div>

        <div class="chart-area">
            <div id="cashflow-chart"></div>
        </div>
    </div>

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-spending" role="tabpanel"
        data-panel="spending" aria-labelledby="rep-tab-spending" tabindex="0" hidden>

<div class="trends-page">

    <div class="trends-card">
        <div class="dashboard-card-header">
            <span class="dashboard-card-title">Spending Trends<span class="fc-info" tabindex="0" role="note"
                aria-label="Each line is one expense category's spending per month over the selected window (the current, incomplete month is excluded). Toggle categories below to focus the view."
                data-tip="Each line is one expense category's spending per month over the selected window (the current, incomplete month is excluded). Toggle categories below to focus the view.">i</span></span>
            <div class="trends-controls">
                <div class="range-selector" id="trends-range">
                    <button class="range-selector-btn" id="trends-range-btn" type="button">12 Months</button>
                    <div class="range-selector-menu" id="trends-range-menu" hidden>
                        <button data-window="6"  type="button">6 Months</button>
                        <button data-window="12" type="button">12 Months</button>
                        <button data-window="36" type="button">3 Years</button>
                        <button data-window="60" type="button">5 Years</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="trends-selector" class="trends-selector"></div>
        <div class="chart-area">
            <div id="trends-chart"></div>
        </div>
    </div>

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-forecast" role="tabpanel"
        data-panel="forecast" aria-labelledby="rep-tab-forecast" tabindex="0" hidden>

<div class="forecast-page">

    <!-- ONE card: the projected line is the report, and the sentence above it
         states the answer in words before the chart shows the shape. Planned
         items used to live in a second card with their own form; they are now
         pins ON the line (see forecast.js) — same idiom as the Recurring
         calendar's chips, where the thing you point at is the thing you edit.
         Secondary knobs (counting transfers) sit behind the ⋮, so the header
         carries only the two the report is actually read through: which account
         and how far ahead. -->
    <div class="forecast-card forecast-card-main">
        <div class="dashboard-card-header">
            <!-- "Balance Forecast", not "Cash Flow Forecast": what it projects is
                 one account's BALANCE, and the sibling tab is already called Cash
                 Flow. The method — and the way to pin a planned item — lives in
                 this one tooltip rather than in standing text above the chart. -->
            <span class="dashboard-card-title">Balance Forecast<span class="fc-info" tabindex="0" role="note"
                aria-label="Projects one account's balance forward, week by week, so a cash crunch inside a month is visible instead of averaged away. Each week combines your typical spending and income (averaged over recent complete months) with the recurring bills and paychecks detected in that account's history, placed on the week they fall. Hover the line to pin a one-off payment or receipt to a date; hover a point for that week's balance. Everything is computed on your device — nothing leaves it."
                data-tip="Projects one account's balance forward, week by week, so a cash crunch inside a month is visible instead of averaged away. Each week combines your typical spending and income (averaged over recent complete months) with the recurring bills and paychecks detected in that account's history, placed on the week they fall. Hover the line to pin a one-off payment or receipt to a date; hover a point for that week's balance. Everything is computed on your device — nothing leaves it.">i</span></span>
            <div class="forecast-controls">
                <!-- Account and horizon are the SAME widget (ui.css's menu-opener
                     button) rather than a native <select> next to a styled one —
                     two lookalike pickers side by side is exactly the drift
                     .range-selector/.stepper were folded together to stop. -->
                <div class="range-selector" id="forecast-account">
                    <button class="range-selector-btn" id="forecast-account-btn" type="button"
                        aria-haspopup="menu" title="Account to forecast">Account</button>
                </div>
                <div class="range-selector" id="forecast-range">
                    <button class="range-selector-btn" id="forecast-range-btn" type="button">3 Months</button>
                    <div class="range-selector-menu" id="forecast-range-menu" hidden>
                        <button data-months="1" type="button">1 Month</button>
                        <button data-months="3" type="button">3 Months</button>
                        <button data-months="6" type="button">6 Months</button>
                    </div>
                </div>
                <button type="button" class="p-menu-btn" id="forecast-kebab-btn" title="Forecast options"
                    aria-label="Forecast options" aria-haspopup="menu">⋮</button>
            </div>
        </div>

        <!-- The answer in a sentence, then a dip warning only when the line
             actually dips, then provenance. Built by forecast.js. -->
        <div class="forecast-summary" id="forecast-summary"></div>

        <!-- The plot and its pointer overlay (the add-here guide) share this
             box; forecast.js sizes the overlay to the SVG it just drew. -->
        <div class="chart-area">
            <div class="forecast-plot" id="forecast-plot">
                <div id="forecast-chart"></div>
                <div class="fc-overlay" id="forecast-overlay" aria-hidden="true"></div>
            </div>
        </div>
    </div>

</div>

    </div><!-- /.rep-panel -->

</div><!-- /.rep-reports -->

        </div>
    </div>

    <!-- @include scripts -->
    <script src="/static/js/pages/reports.js"></script>
    <script src="/static/js/widgets/chart.js"></script>
    <script src="/static/js/widgets/forecast.js"></script>
    <script src="/static/js/widgets/cashflow-sankey.js"></script>
    <script src="/static/js/pages/trends.js"></script>
</body>
</html>
